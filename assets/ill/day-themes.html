<style id="day-themes">
/* One cover colour per weekday. Pastel cover = black text; dark cover = white text. */
.cover.t-mon{background:#b83a0b;color:#fff}.cover.t-mon h1{color:#fff}
.cover.t-tue{background:#ffd23f;color:#151515}.cover.t-tue h1{color:#151515}
.cover.t-wed{background:#17703f;color:#fff}.cover.t-wed h1{color:#fff}
.cover.t-thu{background:#1d4f9a;color:#fff}.cover.t-thu h1{color:#ffd23f}
.cover.t-fri{background:#ffc6cf;color:#151515}.cover.t-fri h1{color:#151515}
.cover.t-sat{background:#ddd0ff;color:#151515}.cover.t-sat h1{color:#151515}
.cover.t-sun{background:#0e5b57;color:#fff}.cover.t-sun h1{color:#ffd23f}
.cover[class*="t-"] h1{-webkit-text-stroke:0!important;text-shadow:none!important}
.cover[class*="t-"] .sub,.cover[class*="t-"] figure{color:inherit}
.cover[class*="t-"] .fs span{background:#fff;color:#151515;border-color:#151515}
.daytag{display:inline-block;font-family:var(--body);font-weight:700;font-size:11px;letter-spacing:.12em;padding:1px 7px;margin:0 0 8px;border:2px solid #151515;background:#151515;color:#fff}
.t-mon .daytag,.t-wed .daytag,.t-thu .daytag,.t-sun .daytag{background:#fff;color:#151515}
.cover[class*="t-"] .byline{font-family:var(--display)!important;font-size:28px!important;letter-spacing:.05em;margin:0 0 6px!important;line-height:1.1}
.cover[class*="t-"]{position:relative}
.cover[class*="t-"] .daytag{position:absolute;top:12px;right:12px;margin:0}
.cover[class*="t-"] .byline{margin:0 0 18px!important;white-space:nowrap}
.cover.t-mon .byline{color:#fff1a8}.cover.t-tue .byline{color:#9d0208}.cover.t-wed .byline{color:#ffd23f}.cover.t-thu .byline{color:#ffffff}.cover.t-fri .byline{color:#9d174d}.cover.t-sat .byline{color:#4c1d95}.cover.t-sun .byline{color:#a7f3d0}
</style>
