name: 4 AM story check
# Runs Claude on GitHub's servers every morning before the 05:00 IST publish.
# Needs the repository secret ANTHROPIC_API_KEY. No computer needed.
on:
  schedule:
    - cron: '40 21 * * *' # 03:10 IST; GitHub can start scheduled runs late
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run the check but do not commit anything'
        type: boolean
        default: true
permissions:
  contents: write
  pages: write
  issues: write
concurrency:
  group: site-write
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Claude Code and Playwright
        run: |
          npm install -g @anthropic-ai/claude-code
          pip install --quiet playwright
      - name: Run the morning check
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TZ: Asia/Kolkata
        run: |
          claude -p "$(cat .github/morning-check.md)" \
            --model claude-opus-5-5 \
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep,WebSearch,WebFetch" \
            --max-turns 250 > claude-log.txt 2>&1 || echo "Claude exited with an error" >> claude-log.txt
          tail -n 40 claude-log.txt
      - name: Keep the report, drop anything outside the site
        run: |
          if [ -f report.md ]; then mv report.md /tmp/report.md; else echo "The check ended without a report. See the Actions log." > /tmp/report.md; fi
          rm -f claude-log.txt
          git checkout -- .github 2>/dev/null || true
          git clean -fdq .github 2>/dev/null || true
          cat /tmp/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Validate the queue
        id: validate
        run: |
          python3 -m unittest discover -s .github -p 'test_publish_due.py'
          python3 .github/publish_due.py --dry-run --now "$(TZ=Asia/Kolkata date +%F)T05:05:00+05:30"
      - name: Undo changes if validation failed
        if: failure() && steps.validate.outcome == 'failure'
        run: |
          git checkout -- . && git clean -fdq
          printf '\n\nVALIDATION FAILED: nothing was changed; the queued story publishes as normal.\n' >> /tmp/report.md
      - name: Add nav and search tags, commit and push
        if: success() && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/build_sitemap.py
          python3 .github/seo_meta.py
          python3 .github/site_nav.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No changes today"; exit 0; fi
          git commit -m "4 AM check for $(TZ=Asia/Kolkata date +%F)"
          git push origin HEAD:main
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
      - name: Notify (GitHub issue)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="4 AM check $(TZ=Asia/Kolkata date +'%-d %b')"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then title="$title (test, nothing committed)"; fi
          [ -f /tmp/report.md ] || echo "The run failed before writing a report. See the Actions log." > /tmp/report.md
          url=$(gh issue create --title "$title" --body-file /tmp/report.md)
          gh issue close "$url" || true
