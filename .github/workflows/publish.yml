name: Publish today's story
on:
  schedule:
    - cron: '30 23 * * *' # 05:00 IST, previous UTC date
    - cron: '15 * * * *' # Hourly recovery checks; script enforces one release per IST day
  push:
    branches: [main]
    paths:
      - '.github/publish_due.py'
      - '.github/test_publish_due.py'
      - '.github/workflows/publish.yml'
      - '.github/build_search.py'
      - '.github/site_nav.py'
      - '.github/seo_meta.py'
      - '**/*.html'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validate and preview without changing the site'
        type: boolean
        default: false
permissions:
  contents: write
  pages: write
concurrency:
  group: site-write
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Test publishing safeguards
        run: python3 -m unittest discover -s .github -p 'test_publish_due.py' -v
      - name: Validate and preview current queue
        run: python3 .github/publish_due.py --dry-run
      - name: Publish next due story
        id: publish
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        run: python3 .github/publish_due.py
      - name: Rebuild sitemap.xml
        if: steps.publish.outputs.changed == 'true'
        run: python3 .github/build_sitemap.py
      - name: Build the search index
        id: search
        if: >-
          steps.publish.outputs.changed == 'true' ||
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && !inputs.dry_run) ||
          (github.event_name == 'schedule' && hashFiles('pagefind/pagefind.js') == '')
        run: |
          python3 -m venv "$RUNNER_TEMP/story-seo"
          "$RUNNER_TEMP/story-seo/bin/pip" install playwright
          "$RUNNER_TEMP/story-seo/bin/python" .github/seo_meta.py
          python3 .github/site_nav.py
          python3 .github/build_search.py
      - name: Commit published pages and search index together
        if: steps.search.outcome == 'success'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html archive/index.html publishing-queue.json sitemap.xml
          git diff --cached --check
          # Story pages get search tags added; some use CRLF, which --check flags.
          git add -u -- '*.html'
          git add -A -- pagefind '*og-share.jpg'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh published pages and search index"
          # Never rebase stale generated pages over concurrent changes. A rejected
          # push fails safely; the next hourly check starts from the current main.
          git push origin HEAD:main
      - name: Request GitHub Pages build
        # Retry the build on later checks too, in case a previous release committed
        # successfully but its Pages build request failed.
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(TZ=Asia/Kolkata date +%H)" -ge 5 ]; then
            gh api --method POST "repos/${{ github.repository }}/pages/builds"
          fi
