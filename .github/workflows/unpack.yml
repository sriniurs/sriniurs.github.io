name: Unpack site update
on:
  push:
    branches: [main]
    paths: ['site-update*.zip']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: site-write
  cancel-in-progress: false
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack zip(s)
        run: python3 .github/unpack_site.py
      - name: Publish anything already due (stories uploaded on their own day)
        run: python3 .github/publish_due.py
      - name: Commit unpacked files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Unpack site update"
          git push
      - name: Rebuild GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST repos/${{ github.repository }}/pages/builds || echo "Pages rebuild request failed (push may already trigger it)"
