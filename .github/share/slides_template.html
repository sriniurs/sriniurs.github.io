<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--skin:#e3a877;--hair:#1a1a1a;--grey:#b9bec4;--red:#e63946;--blue:#1f7ad1;--yellow:#ffd23f;--line:#151515;--ink:#151515;--panel:#fff;--c:{{C}}}
body{background:#fbf7ef;color:#17181a;font-family:system-ui,'DejaVu Sans',sans-serif;position:relative;overflow:hidden;-webkit-font-smoothing:antialiased}
.wm{font-weight:900;letter-spacing:.22em;text-transform:uppercase;color:#fff;display:flex;align-items:center;gap:14px}
.wm:before{content:"";width:20px;height:20px;border-radius:50%;background:#ffd23f}
.wm b{color:#ffd23f;font-weight:900}
.circ{background:#fff;border-radius:50%;box-shadow:0 30px 60px rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center}
.circ svg{width:72%;height:72%}

html,body{width:1080px;height:1920px}
.wm{position:absolute;left:80px;top:112px;font-size:44px;z-index:2}
.n{position:absolute;right:80px;top:118px;font-weight:800;font-size:30px;letter-spacing:.1em;color:#fff;opacity:.8;z-index:2}
.band{position:absolute;left:0;right:0;top:0;background:var(--c);border-radius:0 0 80px 80px}
h1{font-weight:900;font-size:150px;line-height:.98;letter-spacing:-.035em}
h1 em{font-style:normal;color:var(--c)}
.sub{margin-top:36px;font-size:60px;font-weight:700;color:#3f4348;line-height:1.25}
.who{display:flex;align-items:center;gap:24px}
.who.rt{flex-direction:row-reverse}
.av{flex:0 0 250px;height:250px;border-radius:50%;background:#fff;border:6px solid var(--c);overflow:hidden;box-shadow:0 14px 30px rgba(0,0,0,.12)}
.av svg{width:100%;height:100%}
.bub{background:#fff;border-radius:38px;padding:28px 36px;font-size:52px;font-weight:800;line-height:1.2;box-shadow:0 14px 34px rgba(0,0,0,.10)}
.bub small{display:block;font-size:26px;letter-spacing:.16em;font-weight:900;color:var(--c);margin-bottom:6px;text-transform:uppercase}
.cast{position:absolute;left:70px;right:70px;bottom:140px;display:flex;flex-direction:column;gap:30px}
.q{background:#fff;border-radius:40px;padding:50px 40px;margin:0 0 40px;display:flex;gap:28px;align-items:center;box-shadow:0 14px 34px rgba(0,0,0,.08)}
.q .ic{flex:0 0 140px;height:140px;border-radius:50%;background:#f3efe6;display:flex;align-items:center;justify-content:center}
.q .ic svg{width:74%;height:74%}
.q p{font-size:50px;font-weight:700;line-height:1.18;flex:1}
.q .a{flex:0 0 auto;text-align:center}
.q .a span{display:block;background:var(--c);color:#fff;font-weight:900;font-size:46px;letter-spacing:.04em;padding:14px 26px;border-radius:22px}
.q .a small{display:block;margin-top:10px;font-size:34px;font-weight:700;color:#55595f}
body.s3{background:var(--c)}
body.s3 h1{color:#fff}
body.s3 h1 em{color:#ffd23f}
.url{margin-top:56px;display:inline-block;background:#fff;color:#17181a;font-weight:900;font-size:50px;padding:30px 42px;border-radius:999px;box-shadow:0 16px 36px rgba(0,0,0,.2)}
.tap{margin-top:30px;font-size:52px;font-weight:800;color:#fff}
body.s3 .bub{box-shadow:0 14px 34px rgba(0,0,0,.18)}
body.s3 .av{border-color:#fff}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs><symbol id="kiran" viewBox="0 0 64 64">
    <rect x="12" y="46" width="40" height="22" rx="10" fill="var(--blue)" stroke="#151515" stroke-width="2"/>
    <circle cx="32" cy="30" r="15" fill="var(--skin)" stroke="#151515" stroke-width="2"/>
    <path d="M17 26 L20 14 L25 21 L29 11 L33 20 L38 11 L41 21 L46 15 L47 27 Q32 19 17 26Z" fill="var(--hair)" stroke="#151515" stroke-width="1.5"/>
    <circle cx="26.5" cy="31" r="2" fill="#151515"/><circle cx="37.5" cy="31" r="2" fill="#151515"/>
    <path d="M26 37 Q32 42 38 37" stroke="#151515" stroke-width="2" fill="none" stroke-linecap="round"/>
  </symbol>
<symbol id="guru" viewBox="0 0 64 64">
    <rect x="12" y="46" width="40" height="22" rx="10" fill="var(--red)" stroke="#151515" stroke-width="2"/>
    <circle cx="32" cy="30" r="15" fill="var(--skin)" stroke="#151515" stroke-width="2"/>
    <path d="M17 30 Q16 16 32 15 Q48 16 47 30 Q44 21 32 21 Q20 21 17 30Z" fill="var(--grey)" stroke="#151515" stroke-width="1.5"/>
    <circle cx="26" cy="30" r="4.5" fill="#fff" stroke="#151515" stroke-width="2"/><circle cx="38" cy="30" r="4.5" fill="#fff" stroke="#151515" stroke-width="2"/>
    <line x1="30.5" y1="30" x2="33.5" y2="30" stroke="#151515" stroke-width="2"/>
    <circle cx="26" cy="30" r="1.5" fill="#151515"/><circle cx="38" cy="30" r="1.5" fill="#151515"/>
    <path d="M25 37 Q32 34 39 37 Q32 40 25 37Z" fill="var(--grey)" stroke="#151515" stroke-width="1.5"/>
    <path d="M28 41 Q32 43 36 41" stroke="#151515" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  </symbol></defs></svg>
<div class="band" id="band"></div>
<div class="wm">Srini <b>presents</b></div><div class="n" id="n"></div>
<div id="m"></div><div class="cast" id="c"></div>
<script>
const D={{SPEC}};
const s=+new URLSearchParams(location.search).get('s');
document.getElementById('n').textContent=s+' / 3';
const m=document.getElementById('m'),c=document.getElementById('c'),band=document.getElementById('band');
const e=x=>String(x).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const em=x=>e(x).replace(/\*(.+?)\*/g,'<em>$1</em>').replace(/\n/g,'<br>');
const who=(id,name,txt,rt)=>txt?`<div class="who ${rt?'rt':''}"><div class="av"><svg viewBox="0 0 64 64"><use href="#${id}"/></svg></div><div class="bub"><small>${name}</small>${e(txt)}</div></div>`:'';
const circ=(a,sz,top)=>a?`<div class="circ" style="position:absolute;left:50%;top:${top}px;width:${sz}px;height:${sz}px;margin-left:-${sz/2}px"><svg viewBox="0 0 100 100">${a}</svg></div>`:'';
if(s===1){band.style.height='860px';
 m.innerHTML=circ(D.art1,520,260)+`<div style="position:absolute;left:80px;right:80px;top:940px"><h1>${em(D.title)}</h1><div class="sub">${em(D.sub||'')}</div></div>`;
 c.innerHTML=who('kiran','Zappy',D.zappy1,false);}
if(s===2){band.style.height='250px';
 m.innerHTML=`<div style="position:absolute;left:70px;right:70px;top:340px"><div style="font-weight:900;font-size:40px;letter-spacing:.18em;color:var(--c);margin:0 0 30px 10px">3 QUESTIONS · 3 TRAPS</div>`+D.questions.map(q=>`<div class="q">${q.art?`<div class="ic"><svg viewBox="0 0 100 100">${q.art}</svg></div>`:''}<p>${e(q.q)}</p><div class="a"><span>${e(q.a)}</span>${q.note?`<small>${e(q.note)}</small>`:''}</div></div>`).join('')+`</div>`;
 c.innerHTML=who('guru','Prof. Bolt',D.bolt2,true);}
if(s===3){document.body.classList.add('s3');band.style.height='0';
 m.innerHTML=circ(D.art3,240,230)+`<div style="position:absolute;left:80px;right:80px;top:520px"><h1 style="font-size:124px">${em(D.more)}</h1><div class="url">${e(D.url)}</div><div class="tap">${e(D.tap||'Tap the link to read ↓')}</div></div>`;
 c.innerHTML=who('kiran','Zappy',D.zappy3,false)+who('guru','Prof. Bolt',D.bolt3,true);}
</script></body></html>
