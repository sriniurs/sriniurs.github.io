<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:'Alfa Slab One';src:url(fonts/AlfaSlabOne-Regular.ttf)}
*{margin:0;padding:0;box-sizing:border-box}
:root{--skin:#e3a877;--hair:#1a1a1a;--grey:#b9bec4;--red:#e63946;--blue:#1f7ad1;--yellow:#ffd23f;--line:#151515;--ink:#151515;--panel:#fff}
body{width:1920px;height:1080px;background:{{PAPER}};color:#151515;font-family:system-ui,'DejaVu Sans',sans-serif;position:relative;overflow:hidden}
.top{position:absolute;left:100px;top:70px;font-family:'Alfa Slab One';font-size:60px;background:#7a1020;color:#fff;padding:12px 32px 16px;border:6px solid #151515;box-shadow:9px 9px 0 #151515;transform:rotate(-2deg)}
.top b{font-weight:400;color:#ffd23f}
.n{position:absolute;right:100px;top:90px;font-weight:800;font-size:34px;letter-spacing:.1em;opacity:.45}
.mid{position:absolute;left:100px;width:1120px;top:250px;bottom:80px;display:flex;flex-direction:column;justify-content:center}
.side{position:absolute;right:100px;width:560px;top:200px;bottom:70px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:40px}
h1{font-family:'Alfa Slab One';font-weight:400;font-size:136px;line-height:1.02}
h1 em{font-style:normal;color:#c0262d}
.sub{margin-top:34px;font-size:54px;font-weight:700;line-height:1.25}
.art{width:340px;height:340px;background:#fff;border:7px solid #151515;border-radius:44px;box-shadow:12px 12px 0 #151515;padding:26px;transform:rotate(4deg)}
.art svg{width:100%;height:100%}
.q{border-top:5px solid #151515;padding:24px 0;display:flex;gap:30px;align-items:center}
.q:last-child{border-bottom:5px solid #151515}
.q .ic{flex:0 0 120px;height:120px;background:#fff;border:5px solid #151515;border-radius:26px;padding:11px}
.q .ic svg{width:100%;height:100%}
.q .t{display:flex;align-items:center;justify-content:space-between;gap:30px;flex:1}
.q p{font-size:46px;font-weight:700;line-height:1.18}
.q .a{text-align:right;flex:0 0 auto}
.q .a span{display:block;font-family:'Alfa Slab One';font-size:76px;color:#c0262d;line-height:1}
.q .a small{display:block;font-size:34px;font-weight:600;opacity:.75;margin-top:4px}
.url{margin-top:50px;align-self:flex-start;background:#151515;color:#fff;font-weight:800;font-size:54px;padding:28px 44px;border-radius:999px}
.tap{margin-top:28px;font-size:44px;font-weight:700;opacity:.75}
.who{display:flex;flex-direction:column;align-items:center;gap:18px;width:100%}
.av{width:190px;height:190px;border-radius:50%;background:#fff;border:7px solid #151515;overflow:hidden;box-shadow:8px 8px 0 #151515}
.av svg{width:100%;height:100%}
.bub{background:#fff;border:6px solid #151515;border-radius:32px;padding:20px 30px;font-size:44px;font-weight:800;line-height:1.2;box-shadow:8px 8px 0 #151515;text-align:center;max-width:560px}
.bub.g{background:#fff3c4}
.bub small{display:block;font-size:24px;letter-spacing:.12em;font-weight:900;opacity:.55;margin-bottom:4px;text-transform:uppercase}
.pair{display:flex;gap:30px;align-items:flex-start;width:100%}
.pair .who{flex:1}
.pair .av{width:160px;height:160px}
.pair .bub{font-size:38px;padding:18px 22px}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs><symbol id="kiran" viewBox="0 0 64 64">
    <rect x="12" y="46" width="40" height="22" rx="10" fill="var(--blue)" stroke="#151515" stroke-width="2"/>
    <circle cx="32" cy="30" r="15" fill="var(--skin)" stroke="#151515" stroke-width="2"/>
    <path d="M17 26 L20 14 L25 21 L29 11 L33 20 L38 11 L41 21 L46 15 L47 27 Q32 19 17 26Z" fill="var(--hair)" stroke="#151515" stroke-width="1.5"/>
    <circle cx="26.5" cy="31" r="2" fill="#151515"/><circle cx="37.5" cy="31" r="2" fill="#151515"/>
    <path d="M26 37 Q32 42 38 37" stroke="#151515" stroke-width="2" fill="none" stroke-linecap="round"/>
  </symbol>
<symbol id="guru" viewBox="0 0 64 64">
    <rect x="12" y="46" width="40" height="22" rx="10" fill="var(--red)" stroke="#151515" stroke-width="2"/>
    <circle cx="32" cy="30" r="15" fill="var(--skin)" stroke="#151515" stroke-width="2"/>
    <path d="M17 30 Q16 16 32 15 Q48 16 47 30 Q44 21 32 21 Q20 21 17 30Z" fill="var(--grey)" stroke="#151515" stroke-width="1.5"/>
    <circle cx="26" cy="30" r="4.5" fill="#fff" stroke="#151515" stroke-width="2"/><circle cx="38" cy="30" r="4.5" fill="#fff" stroke="#151515" stroke-width="2"/>
    <line x1="30.5" y1="30" x2="33.5" y2="30" stroke="#151515" stroke-width="2"/>
    <circle cx="26" cy="30" r="1.5" fill="#151515"/><circle cx="38" cy="30" r="1.5" fill="#151515"/>
    <path d="M25 37 Q32 34 39 37 Q32 40 25 37Z" fill="var(--grey)" stroke="#151515" stroke-width="1.5"/>
    <path d="M28 41 Q32 43 36 41" stroke="#151515" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  </symbol></defs></svg>
<div class="top">Srini <b>presents</b></div><div class="n" id="n"></div>
<div class="mid" id="m"></div><div class="side" id="c"></div>
<script>
const D={{SPEC}};
const s=+new URLSearchParams(location.search).get('s');
document.getElementById('n').textContent=s+' / 3';
const m=document.getElementById('m'),c=document.getElementById('c');
const e=x=>String(x).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const em=x=>e(x).replace(/\*(.+?)\*/g,'<em>$1</em>').replace(/\n/g,'<br>');
const art=a=>a?`<div class="art"><svg viewBox="0 0 100 100">${a}</svg></div>`:'';
const who=(id,name,txt,g)=>txt?`<div class="who"><div class="bub ${g?'g':''}"><small>${name}</small>${e(txt)}</div><div class="av"><svg viewBox="0 0 64 64"><use href="#${id}"/></svg></div></div>`:'';
if(s===1){m.innerHTML=`<h1>${em(D.title)}</h1><div class="sub">${em(D.sub||'')}</div>`;
 c.innerHTML=art(D.art1)+who('kiran','Zappy',D.zappy1,false);}
if(s===2){m.innerHTML=D.questions.map(q=>`<div class="q">${q.art?`<div class="ic"><svg viewBox="0 0 100 100">${q.art}</svg></div>`:''}<div class="t"><p>${e(q.q)}</p><div class="a"><span>${e(q.a)}</span>${q.note?`<small>${e(q.note)}</small>`:''}</div></div></div>`).join('');
 c.innerHTML=who('guru','Prof. Bolt',D.bolt2,true);}
if(s===3){m.innerHTML=`<h1>${em(D.more)}</h1><div class="url">${e(D.url)}</div><div class="tap">${e(D.tap||'Tap the link to read ↓')}</div>`;
 c.innerHTML=art(D.art3)+`<div class="pair">${who('kiran','Zappy',D.zappy3,false)}${who('guru','Prof. Bolt',D.bolt3,true)}</div>`;}
</script></body></html>
