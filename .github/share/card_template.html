<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--skin:#e3a877;--hair:#1a1a1a;--grey:#b9bec4;--red:#e63946;--blue:#1f7ad1;--yellow:#ffd23f;--line:#151515;--ink:#151515;--panel:#fff;--c:{{C}}}
body{background:#fbf7ef;color:#17181a;font-family:system-ui,'DejaVu Sans',sans-serif;position:relative;overflow:hidden;-webkit-font-smoothing:antialiased}
.wm{font-weight:900;letter-spacing:.22em;text-transform:uppercase;color:#fff;display:flex;align-items:center;gap:14px}
.wm:before{content:"";width:16px;height:16px;border-radius:50%;background:#ffd23f}
.wm b{color:#ffd23f;font-weight:900}
.circ{background:#fff;border-radius:50%;box-shadow:0 30px 60px rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center}
.circ svg{width:72%;height:72%}

html,body{width:720px;height:1280px}
.top{position:absolute;left:0;right:0;top:0;height:720px;background:var(--c);border-radius:0 0 56px 56px}
.wm{position:absolute;left:48px;top:60px;font-size:30px}
.day{position:absolute;left:48px;top:118px;color:#fff;font-weight:800;font-size:16px;letter-spacing:.14em;border:2px solid rgba(255,255,255,.55);border-radius:999px;padding:9px 16px}
.circ{position:absolute;left:50%;top:200px;width:420px;height:420px;margin-left:-210px}
.title{position:absolute;left:48px;right:48px;top:770px;font-weight:900;font-size:52px;line-height:1.05;letter-spacing:-.02em}
.note{position:absolute;left:48px;right:48px;font-size:32px;font-weight:600;line-height:1.3;color:#3a3d42}
.note b{color:var(--c);font-weight:900}
.tap{position:absolute;left:48px;bottom:150px;font-size:31px;font-weight:900;background:#17181a;color:#fff;border-radius:999px;padding:20px 34px;display:flex;gap:12px;align-items:center}
.tap i{font-style:normal;color:#ffd23f}
.tag{position:absolute;left:52px;bottom:250px;text-align:left!important;font-size:19px;font-weight:900;letter-spacing:.16em;color:#6b6f75;text-align:right;line-height:1.5}
</style></head><body>
<div class="top"></div>
<div class="wm">Srini <b>presents</b></div>
<div class="day">{{WEEKDAY}} · {{THEME}}</div>
<div class="circ"><svg viewBox="0 0 430 400">{{ART}}</svg></div>
<div class="title" id="t">{{TITLE}}</div>
<div class="note" id="n">{{NOTE}}</div>
<div class="tap">Tap the link below <i>↓</i></div>
<div class="tag">THE WHOLE STORY, SIMPLY TOLD</div>
<script>
const t=document.getElementById('t'),n=document.getElementById('n');let f=52;
const lay=()=>{n.style.top=(t.getBoundingClientRect().bottom+22)+'px'};
window.cardReady=document.fonts.ready.then(()=>{lay();while(n.getBoundingClientRect().bottom>1280-250-40&&f>32){f-=2;t.style.fontSize=f+'px';lay();}});
</script></body></html>
