<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:'Alfa Slab One';src:url(fonts/AlfaSlabOne-Regular.ttf)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:720px;height:1280px;overflow:hidden}
body{background:{{PAPER}};color:#151515;font-family:system-ui,'DejaVu Sans',sans-serif;position:relative}
.lab{position:absolute;left:44px;top:70px;font-family:'Alfa Slab One';font-size:40px;background:#7a1020;color:#fff;padding:8px 22px 12px;border:5px solid #151515;box-shadow:7px 7px 0 #151515;transform:rotate(-2deg)}
.lab b{font-weight:400;color:#ffd23f}
.day{position:absolute;left:44px;top:172px;background:#151515;color:#fff;font-weight:900;font-size:19px;letter-spacing:.12em;padding:10px 18px;border-radius:999px}
.day i{font-style:normal;color:#ffd23f}
.art{position:absolute;left:50%;top:250px;width:400px;height:380px;margin-left:-200px;background:#fff;border:7px solid #151515;border-radius:44px;box-shadow:12px 12px 0 #151515;padding:14px;transform:rotate(-3deg)}
.art svg{width:100%;height:100%}
.title{position:absolute;left:44px;right:44px;top:665px;font-family:'Alfa Slab One';font-size:56px;line-height:1.06}
.note{position:absolute;left:44px;right:44px;background:#fff;border:5px solid #151515;border-radius:22px;box-shadow:7px 7px 0 #151515;padding:14px 22px;font-size:29px;font-weight:800;transform:rotate(-1deg)}
.note b{color:#c0262d}
.tag{position:absolute;left:46px;font-size:18px;font-weight:900;letter-spacing:.16em;opacity:.6}
.tap{position:absolute;left:50%;transform:translateX(-50%);bottom:150px;font-size:28px;font-weight:900;background:#ffd23f;border:4px solid #151515;border-radius:999px;padding:12px 28px;white-space:nowrap}
</style></head><body>
<div class="lab">Srini <b>presents</b></div>
<div class="day">{{WEEKDAY}} · <i>{{THEME}}</i></div>
<div class="art"><svg viewBox="0 0 430 400">{{ART}}</svg></div>
<div class="title" id="t">{{TITLE}}</div>
<div class="note" id="n">{{NOTE}}</div>
<div class="tag" id="g">THE WHOLE STORY, SIMPLY TOLD</div>
<div class="tap">👇 Tap the link below 👇</div>
<script>
// title then note stacked; shrink title so everything stays above the tap pill (bottom ~150px kept clear for WhatsApp's caption)
const t=document.getElementById('t'),n=document.getElementById('n'),g=document.getElementById('g');let f=56;
function lay(){const tb=t.getBoundingClientRect().bottom;n.style.top=(tb+26)+'px';g.style.top=(n.getBoundingClientRect().bottom+22)+'px';}
window.cardReady=document.fonts.ready.then(()=>{lay();
 while(g.getBoundingClientRect().bottom>1280-150-90&&f>34){f-=2;t.style.fontSize=f+'px';lay();}});
</script></body></html>
