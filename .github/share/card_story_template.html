<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:'Alfa Slab One';src:url(fonts/AlfaSlabOne-Regular.ttf)}
@font-face{font-family:'Kalam';font-weight:700;src:url(fonts/Kalam-Bold.ttf)}
@font-face{font-family:'Kalam';font-weight:400;src:url(fonts/Kalam-Regular.ttf)}
html,body{margin:0;padding:0}
body{width:720px;height:1280px;overflow:hidden;font-family:'Kalam',cursive}
.card{position:relative;width:720px;height:1280px;background:{{PAPER}};overflow:hidden;display:flex;flex-direction:column;align-items:center;box-sizing:border-box;padding:90px 40px 300px}
.card::before{content:"";position:absolute;inset:0;background:
 radial-gradient(ellipse at 50% 40%,rgba(255,248,230,.75) 0%,rgba(255,248,230,0) 60%),
 radial-gradient(ellipse at 85% 92%,rgba(150,100,40,.22) 0%,rgba(150,100,40,0) 35%),
 radial-gradient(ellipse at 12% 8%,rgba(150,100,40,.18) 0%,rgba(150,100,40,0) 30%),
 radial-gradient(ellipse at 50% 50%,rgba(0,0,0,0) 60%,rgba(90,55,20,.35) 100%)}
.card>*{position:relative}
.grain{position:absolute!important;inset:0;opacity:.35;mix-blend-mode:multiply;pointer-events:none}
.brush{position:relative;transform:rotate(-3deg);flex:none}
.brush span{position:absolute;left:0;top:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;font:700 70px 'Kalam';color:#fbefd5;white-space:nowrap}
.tag{margin-top:22px;font:400 22px 'Alfa Slab One';letter-spacing:.14em;color:#7a1f2b;display:flex;align-items:center;gap:14px;white-space:nowrap;flex:none}
.tag i{display:block;width:34px;height:3px;background:#7a1f2b}
h1{margin:26px 0 0;width:632px;text-align:center;font:400 70px/1.04 'Alfa Slab One';color:#1c2b4a;filter:url(#ink);flex:none}
.uline{margin-top:14px;flex:none}
.note{margin-top:26px;width:500px;padding:20px 18px 16px;background:#fbf3df;border:2px solid #4a3a28;box-shadow:6px 8px 0 rgba(60,40,20,.25);transform:rotate(-2deg);text-align:center;font:700 36px/1.1 'Kalam';color:#1c2b4a;flex:none}
.note u{text-decoration:none;background:linear-gradient(transparent 70%,#f0b429 70%,#f0b429 88%,transparent 88%)}
.pin{position:absolute;left:50%;top:-22px;transform:translateX(-50%)}
.art{flex:1 1 auto;width:640px;min-height:220px;margin-top:14px}
.band{position:absolute!important;left:0;right:0;bottom:0;height:280px;background:linear-gradient(180deg,{{BAND0}} 0,{{BAND}} 90px,{{BAND}} 100%)}
.band span{position:absolute;left:0;right:0;top:60px;text-align:center;font:700 26px 'Kalam';color:#f3e6c8;opacity:.9}
.stamp{flex:none;margin-top:22px;transform:rotate(-2deg);border:3px double #9d0208;color:#9d0208;font:400 17px 'Alfa Slab One';letter-spacing:.14em;padding:6px 14px;opacity:.85;text-align:center;white-space:nowrap}
</style></head><body>
<div class="card">
<svg width="0" height="0" style="position:absolute">
 <defs>
  <filter id="ink"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.2"/></filter>
  <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="14"/></filter>
  <symbol id="kiran" viewBox="0 0 64 64"><rect x="12" y="46" width="40" height="22" rx="10" fill="#3b6ea5" stroke="#151515" stroke-width="2"/><circle cx="32" cy="30" r="15" fill="#e9b98a" stroke="#151515" stroke-width="2"/><path d="M17 26 L20 14 L25 21 L29 11 L33 20 L38 11 L41 21 L46 15 L47 27 Q32 19 17 26Z" fill="#2b1d14" stroke="#151515" stroke-width="1.5"/><circle cx="26.5" cy="31" r="2" fill="#151515"/><circle cx="37.5" cy="31" r="2" fill="#151515"/><path d="M26 37 Q32 42 38 37" stroke="#151515" stroke-width="2" fill="none" stroke-linecap="round"/></symbol>
  <symbol id="guru" viewBox="0 0 64 64"><rect x="12" y="46" width="40" height="22" rx="10" fill="#b5462f" stroke="#151515" stroke-width="2"/><circle cx="32" cy="30" r="15" fill="#e9b98a" stroke="#151515" stroke-width="2"/><path d="M17 30 Q16 16 32 15 Q48 16 47 30 Q44 21 32 21 Q20 21 17 30Z" fill="#d4d4d4" stroke="#151515" stroke-width="1.5"/><circle cx="26" cy="30" r="4.5" fill="#fff" stroke="#151515" stroke-width="2"/><circle cx="38" cy="30" r="4.5" fill="#fff" stroke="#151515" stroke-width="2"/><line x1="30.5" y1="30" x2="33.5" y2="30" stroke="#151515" stroke-width="2"/><circle cx="26" cy="30" r="1.5" fill="#151515"/><circle cx="38" cy="30" r="1.5" fill="#151515"/><path d="M25 37 Q32 34 39 37 Q32 40 25 37Z" fill="#d4d4d4" stroke="#151515" stroke-width="1.5"/><path d="M28 41 Q32 43 36 41" stroke="#151515" stroke-width="1.8" fill="none" stroke-linecap="round"/></symbol>
 </defs>
</svg>
<svg class="grain" width="720" height="1280"><filter id="g"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 0.35  0 0 0 0 0.25  0 0 0 0 0.12  0 0 0 0.55 0"/></filter><rect width="720" height="1280" filter="url(#g)"/></svg>
<div class="brush"><svg width="560" height="116" viewBox="0 0 430 96" preserveAspectRatio="none"><path filter="url(#rough)" d="M12 22 Q120 6 260 14 T420 18 L414 80 Q300 92 160 84 T8 78 Z" fill="#7a1f2b"/></svg><span>Srini presents</span></div>
<div class="tag"><i></i>THE WHOLE STORY, SIMPLY TOLD<i></i></div>
<div class="stamp">{{WEEKDAY}} · {{THEME}}</div>
<h1 id="t">{{TITLE}}</h1>
<svg class="uline" width="420" height="30" viewBox="0 0 420 30"><path filter="url(#rough)" d="M4 18 Q140 4 300 10 T416 12 L414 20 Q280 22 150 24 T6 26 Z" fill="#c0392b"/></svg>
<div class="note"><svg class="pin" width="44" height="54" viewBox="0 0 44 54"><ellipse cx="22" cy="18" rx="16" ry="14" fill="#c0392b" stroke="#5a1a12" stroke-width="2"/><ellipse cx="17" cy="13" rx="5" ry="3.5" fill="#f2a093"/><path d="M22 32 L22 52" stroke="#555" stroke-width="3" stroke-linecap="round"/></svg>{{NOTE}}</div>
<svg class="art" viewBox="0 0 430 400" preserveAspectRatio="xMidYMid meet">{{ART}}</svg>
<div class="band"><span>👇 tap the link below to read 👇</span></div>
</div>
<script>window.cardReady=document.fonts.ready.then(function(){var h=document.getElementById("t"),f=70;while(h.scrollHeight>300&&f>48){f-=2;h.style.fontSize=f+"px";}return true;});</script>
</body></html>
