<!doctype html>

  <title>Search articles · Srini Presents</title>
  <style>
    :root{color-scheme:light;--ink:#09283f;--paper:#fffdf4;--cream:#fff9e7;--red:#962039}
    *{box-sizing:border-box}
    body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.55 "Trebuchet MS",Arial,sans-serif}
    a{color:inherit}
    :focus-visible{outline:3px solid #087c75;outline-offset:4px}
    main{width:min(100% - 32px,760px);margin:34px auto 64px}
    h1{margin:0 0 18px;color:var(--red);font:bold italic clamp(32px,7vw,52px)/1.1 Georgia,serif}
    form{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:end;padding:16px;border:2px solid var(--ink);border-radius:14px;background:#cbdfff;box-shadow:4px 4px 0 var(--ink)}
    label{display:grid;gap:4px;font-weight:bold}
    label:first-child{grid-column:1/-1}
    input,select,button{min-width:0;min-height:44px;padding:8px 10px;border:2px solid var(--ink);border-radius:7px;background:var(--paper);color:var(--ink);font:inherit}
    button{background:#ffe53a;font-weight:bold;cursor:pointer}
    button:disabled{cursor:wait;opacity:.6}
    #status{margin:20px 0 12px}
    ol{list-style:none;padding:0;margin:0 0 16px;display:grid;gap:12px}
    li{padding:12px 16px;background:var(--paper);border:1px solid #dcd6c3;border-radius:9px}
    li h2{margin:0;font:bold 21px/1.2 Georgia,serif}
    li p{margin:5px 0 0}
    li small{color:#475866}
    mark{background:#ffe59c;color:inherit}
  </style>

      <label>Section
