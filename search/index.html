<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Search articles · Srini Presents</title>
  <style>
    :root{color-scheme:light;--ink:#09283f;--paper:#fffdf4;--cream:#fff9e7;--red:#962039}
    *{box-sizing:border-box}
    body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.55 "Trebuchet MS",Arial,sans-serif}
    a{color:inherit}
    :focus-visible{outline:3px solid #087c75;outline-offset:4px}
    main{width:min(100% - 32px,760px);margin:34px auto 64px}
    h1{margin:0 0 18px;color:var(--red);font:bold italic clamp(32px,7vw,52px)/1.1 Georgia,serif}
    form{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:end;padding:16px;border:2px solid var(--ink);border-radius:14px;background:#cbdfff;box-shadow:4px 4px 0 var(--ink)}
    label{display:grid;gap:4px;font-weight:bold}
    label:first-child{grid-column:1/-1}
    input,select,button{min-width:0;min-height:44px;padding:8px 10px;border:2px solid var(--ink);border-radius:7px;background:var(--paper);color:var(--ink);font:inherit}
    button{background:#ffe53a;font-weight:bold;cursor:pointer}
    button:disabled{cursor:wait;opacity:.6}
    #status{margin:20px 0 12px}
    #notice:empty{display:none}
    ol{list-style:none;padding:0;margin:0 0 16px;display:grid;gap:12px}
    li{padding:12px 16px;background:var(--paper);border:1px solid #dcd6c3;border-radius:9px}
    li h2{margin:0;font:bold 21px/1.2 Georgia,serif}
    li p{margin:5px 0 0}
    li small{color:#475866}
    mark{background:#ffe59c;color:inherit}
  </style>
  <script type="module" src="./search.js"></script>
</head>
<body>
<!-- sitenav:auto --><style>
.sp-bar{position:sticky;top:0;z-index:9999;display:flex;gap:8px;align-items:center;
padding:8px 12px;background:rgba(255,253,244,.94);border-bottom:2px solid #09283f;
backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
font:700 14px/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.sp-bar a{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;
border:2px solid #09283f;background:#fff;color:#09283f;text-decoration:none;box-shadow:2px 2px 0 #09283f}
.sp-bar a:hover,.sp-bar a:focus-visible{background:#ffe53a}
.sp-bar a:active{transform:translate(1px,1px);box-shadow:1px 1px 0 #09283f}
.sp-bar .sp-brand{margin-left:auto;border:0;box-shadow:none;background:none;padding:0 2px}
.sp-bar .sp-brand img{display:block;height:36px;width:auto}
.sp-bar .sp-brand:hover{background:none}
@media(max-width:420px){.sp-bar{gap:5px;padding:6px 8px}.sp-bar a{padding:7px 8px}.sp-bar .sp-brand img{height:29px}}
@media print{.sp-bar{display:none}}
</style>
<nav class="sp-bar" aria-label="Site">
<a href="/archive/" id="sp-back" aria-label="Go back">&larr; Back</a>
<a href="/" aria-label="Home page">&#8962; Home</a>
<a href="/search/" aria-label="Search articles">Search</a>
<a class="sp-brand" href="/"><img src="/assets/brand/logo.png" alt="srini.presents" width="420" height="192"></a>
</nav>
<script>
(function(){var b=document.getElementById('sp-back');if(!b)return;
b.addEventListener('click',function(e){var r=document.referrer;
if(r&&new URL(r).origin===location.origin&&r.split('#')[0]!==location.href.split('#')[0]&&history.length>1&&!e.metaKey&&!e.ctrlKey&&!e.shiftKey&&!e.altKey){e.preventDefault();history.back();}});})();
</script>
<!-- /sitenav:auto -->
  <main>
    <h1>Search articles</h1>
    <form id="search" role="search">
      <label>Search terms
        <input id="query" type="search" placeholder="Try blood pressure or market rally" required>
      </label>
      <label>Section
        <select id="section">
          <option value="">All sections</option>
          <option>Everyday Curiosity</option>
          <option value="The Nifty Chronicles">The Nifty Chronicles</option>
          <option>Ortho</option>
          <option>Common Health Conditions</option>
        </select>
      </label>
      <button type="submit">Search</button>
    </form>
    <p id="notice" role="status"></p>
    <p id="status" role="status"></p>
    <ol id="results"></ol>
    <button id="more" type="button" hidden>Show more results</button>
    <noscript><p>Search needs JavaScript. You can also <a href="/archive/">browse the archive</a>.</p></noscript>
  </main>
</body>
</html>
